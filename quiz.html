<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Festival Irruzioni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0c0d0f;
      --surface: #141619;
      --surface-border: #23272d;
      --red: #d91b24;
      --red-hover: #b8141c;
      --text: #f0f2f5;
      --text-muted: #9ba3af;
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.12);
      --correct-border: rgba(16, 185, 129, 0.4);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.12);
      --wrong-border: rgba(239, 68, 68, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      padding: 2.5rem 1rem 4rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--red);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .nav-back:hover {
      color: #fff;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    h1 span {
      color: var(--red);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.75rem;
      transition: border-color 0.2s ease;
    }

    .question-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .question-num {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--red);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.9rem 1.1rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--surface-border);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .option-label:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: #3b424d;
    }

    .option-label input[type="radio"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-muted);
      border-radius: 50%;
      outline: none;
      display: grid;
      place-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }

    .option-label input[type="radio"]::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transform: scale(0);
      transition: transform 0.15s ease-in-out;
      background-color: var(--red);
    }

    .option-label input[type="radio"]:checked {
      border-color: var(--red);
    }

    .option-label input[type="radio"]:checked::before {
      transform: scale(1);
    }

    /* Feedback visuale post-verifica */
    .option-label.is-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #34d399;
      font-weight: 500;
    }
    .option-label.is-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: #f87171;
    }

    .explanation-box {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid var(--red);
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .explanation-box strong {
      color: #fff;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      margin-top: 2rem;
    }

    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.9rem 2.25rem;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-submit {
      background: var(--red);
      color: #fff;
    }
    .btn-submit:hover {
      background: var(--red-hover);
      box-shadow: 0 4px 16px rgba(217, 27, 36, 0.35);
    }

    .btn-reset {
      display: none;
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
    }
    .btn-reset:hover {
      color: #fff;
      border-color: #555;
    }

    /* Box Risultato Finale */
    .score-banner {
      display: none;
      background: linear-gradient(135deg, rgba(217, 27, 36, 0.15), rgba(0, 0, 0, 0.4));
      border: 1px solid var(--red);
      border-radius: 12px;
      padding: 1.75rem;
      text-align: center;
      margin-bottom: 2.5rem;
